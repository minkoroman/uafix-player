[project]
name = "uafix-player"
version = "1.6.1"
description = "Перегляд каталогу uafix.net і відтворення HLS-потоків"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "flet-video==1.0.4",
    "requests",
    "beautifulsoup4",
    "pychromecast==14.0.10",
    "zeroconf==0.39.4",  # остання версія з чистим Python-пакетом (без збірки під Android)
]

[tool.flet]
org = "net.uafix"
product = "UAFix Player"
company = "UAFix Player"
copyright = "UAFix Player"

[tool.flet.app]
path = "."
exclude = ["run.log", "run2.log", "README.md", "docs", ".github", "icon_options", "dist", "tools", "android_template", "CHANGELOG.md", "sync_worker", "preview"]

# Windows: вікно створюється прихованим, і застосунок показує його вже зі своєю верхньою
# панеллю (інакше спершу на мить з'являлось вікно із системним заголовком, потім —
# перебудовувалось, наче закрилось і відкрилось)
[tool.flet.windows.app]
hide_window_on_start = true

[tool.flet.android]
# фон адаптивної іконки — як у самої іконки (інакше Flet підкладає білий і з'являється ореол);
# сама іконка — assets/icon_android.png на всю площу, зміст у безпечній зоні
adaptive_icon_background = "#15171C"

[tool.flet.android.permission]
# встановлення завантаженого застосунком оновлення (системне вікно «Встановити»)
"android.permission.REQUEST_INSTALL_PACKAGES" = true
# пошук Chromecast / Google TV у Wi-Fi (mDNS)
"android.permission.CHANGE_WIFI_MULTICAST_STATE" = true
"android.permission.ACCESS_WIFI_STATE" = true
"android.permission.ACCESS_NETWORK_STATE" = true

# дозвіл на інтернет (android.permission.INTERNET) і мережевий доступ macOS Flet додає сам

# macOS: дозвіл на локальну мережу — пошук і керування Chromecast / Google TV
[tool.flet.macos.info]
NSLocalNetworkUsageDescription = "Щоб знайти телевізор (Chromecast, Google TV) у вашій мережі й транслювати на нього відео."
NSBonjourServices = ["_googlecast._tcp"]

# заставка під час запуску — темна, в кольорі застосунку (за замовчуванням біла)
[tool.flet.splash]
color = "#0D0E12"
dark_color = "#0D0E12"

[tool.flet.boot_screen.flet]
theme_mode = "dark"
bgcolor_light = "#0D0E12"
bgcolor_dark = "#0D0E12"
spinner_color_light = "#FF6A3D"
spinner_color_dark = "#FF6A3D"
spinner_size = 36
text_color_light = "#9BA1AC"
text_color_dark = "#9BA1AC"
# перший запуск після встановлення/оновлення розпаковує застосунок — це довше звичайного
prepare_message = "Готую нову версію… Перший запуск після оновлення може тривати до хвилини"
