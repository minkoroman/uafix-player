name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Які платформи збирати"
        type: choice
        default: all
        options: [all, android, macos, windows]
      mac_runner:
        description: "Mac-сервер (коли macos-latest на Apple Silicon довго недоступний — macos-15-intel)"
        type: string
        default: macos-latest

env:
  PYTHONUTF8: "1"            # кирилиця у виводі flet build на Windows
  PYTHONIOENCODING: utf-8

jobs:
  # перелік збірок; при ручному запуску можна обрати лише потрібні платформи
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: python
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}
          MAC_RUNNER: ${{ github.event.inputs.mac_runner || 'macos-latest' }}
        run: |
          import json, os
          jobs = [
              {"name": "macOS", "os": os.environ["MAC_RUNNER"], "target": "macos",
               "artifact": "UAFix-Player-macOS", "group": "macos"},
              {"name": "Windows", "os": "windows-latest", "target": "windows",
               "artifact": "UAFix-Player-Windows", "group": "windows"},
              {"name": "Android", "os": "ubuntu-latest", "target": "apk",
               "artifact": "UAFix-Player-Android", "group": "android"},
              {"name": "Android TV", "os": "ubuntu-latest", "target": "apk",
               "artifact": "UAFix-Player-AndroidTV", "group": "android", "tv": True},
          ]
          want = os.environ["PLATFORMS"]
          picked = [j for j in jobs if want == "all" or j["group"] == want]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": picked}) + "\n")
          print(json.dumps(picked, indent=1))

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17 (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: pip install "flet[cli]==1.0.4"

      # Версія вшивається в застосунок (app_version.py) для перевірки оновлень:
      # з тегу v1.2.3 → 1.2.3, інакше — з pyproject.toml
      - name: App version
        shell: python
        # токен бота для «Повідомити про проблему» (секрети репозиторію; без них — форма GitHub)
        env:
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
          FEEDBACK_CHAT_ID: ${{ secrets.FEEDBACK_CHAT_ID }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}  # широкі кадри для банера (tmdb.py)
        run: |
          import os, re
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and ref.startswith("v"):
              version = ref[1:]
          else:
              version = re.search(r'^version\s*=\s*"([^"]+)"', open("pyproject.toml", encoding="utf-8").read(), re.M).group(1)
          with open("app_version.py", "w", encoding="utf-8") as f:
              f.write(f'VERSION = "{version}"\n')
              f.write(f'FEEDBACK_BOT_TOKEN = {os.environ.get("FEEDBACK_BOT_TOKEN", "")!r}\n')
              f.write(f'FEEDBACK_CHAT_ID = {os.environ.get("FEEDBACK_CHAT_ID", "")!r}\n')
              f.write(f'TMDB_TOKEN = {os.environ.get("TMDB_TOKEN", "")!r}\n')
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"APP_VERSION={version}\n")
          print("version:", version)

      # Постійний ключ підпису: без нього кожна збірка підписана новим ключем, і Android
      # не встановлює оновлення поверх попередньої версії
      - name: Android signing key
        if: matrix.target == 'apk'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Немає секрету ANDROID_KEYSTORE_B64 — підпис налагоджувальним ключем"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uafix-release.p12"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/uafix-release.p12"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=uafix"
          } >> "$GITHUB_ENV"

      # TV-збірка: прапорець вмикає TV-режим (керування з пульта, плеєр на весь екран);
      # окремі назва й ідентифікатор — щоб ставилась поруч зі звичайною версією
      - name: Android TV mode
        if: matrix.tv
        run: |
          echo '"""Наявність цього модуля вмикає TV-режим (див. main.py)."""' > uafix_tv_flag.py
          echo 'TV_ARGS=--product "UAFix TV" --bundle-id net.uafix.uafix_tv --project uafix-tv' >> "$GITHUB_ENV"

      # Android: шаблон з запитом високої частоти екрана (90/120 Гц) і окремі apk під
      # процесори — замість одного «товстого» apk на ~190 МБ з трьома архітектурами
      - name: Android template (high refresh rate) + per-ABI apk
        if: matrix.target == 'apk'
        run: |
          python tools/android_template.py android_template
          # у реліз: телефон — лише arm64, телевізор — лише armv7 (іде й на 64-бітних TV)
          if [ "${{ matrix.tv }}" = "true" ]; then ARCH=armeabi-v7a; else ARCH=arm64-v8a; fi
          echo "APK_ARGS=--template android_template/build --split-per-abi --arch $ARCH" >> "$GITHUB_ENV"
          # код версії Android = 1000 × архітектура + номер збірки (armv7 — 1, arm64 — 2).
          # TV раніше був і arm64 (2xxx): щоб armv7 ставився поверх, номер TV +2000 (→ 3xxx)
          if [ "${{ matrix.tv }}" = "true" ]; then N=$(( ${{ github.run_number }} + 2000 )); else N=${{ github.run_number }}; fi
          echo "BUILD_NUMBER=$N" >> "$GITHUB_ENV"

      # NDK — заздалегідь і з повторами: Gradle сам качає його посеред збірки, і архів
      # кілька разів приходив пошкодженим («Archive is not a ZIP archive») — збірка падала
      - name: Android NDK
        if: matrix.target == 'apk'
        shell: bash
        run: |
          NDK=28.2.13676358
          SDK=/usr/local/lib/android/sdk
          for attempt in 1 2 3 4; do
            [ -f "$SDK/ndk/$NDK/source.properties" ] && exit 0
            rm -rf "$SDK/ndk/$NDK" "$SDK/.temp"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "ndk;$NDK" > /dev/null || true
            sleep 5
          done
          [ -f "$SDK/ndk/$NDK/source.properties" ]

      # друга спроба — на випадок мережевого збою (бувало: пошкоджений завантажений архів Python)
      # обмеження часу: зазвичай збірка йде ~10 хв, а зависла (бувало з Android) інакше
      # висить годинами — краще швидко впасти й перезапустити
      - name: flet build ${{ matrix.target }}
        shell: bash
        timeout-minutes: 30
        run: |
          for attempt in 1 2; do
            flet build ${{ matrix.target }} --yes --verbose --no-rich-output --build-number ${{ env.BUILD_NUMBER || github.run_number }} --build-version ${{ env.APP_VERSION }} ${{ env.TV_ARGS }} ${{ env.APK_ARGS }} && exit 0
            echo "::warning::flet build failed (attempt $attempt), retrying"
            rm -rf build/flutter/build
            # недокачаний NDK лишається на диску й ламає і другу спробу — прибрати
            for d in /usr/local/lib/android/sdk/ndk/*; do
              [ -d "$d" ] && [ ! -f "$d/source.properties" ] && rm -rf "$d"
            done
          done
          exit 1

      - name: Pack macOS app
        if: matrix.target == 'macos'
        run: |
          cd build/macos
          ditto -c -k --sequesterRsrc --keepParent "$(ls -d *.app | head -1)" ../../UAFix-Player-macOS.zip

      - name: Pack Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        # архів — лише всередину портативного .exe (окремо в реліз його не викладаємо)
        run: Compress-Archive -Path build/windows/* -DestinationPath tools/win_launcher/app.zip

      # портативний .exe: запускач на Go з вбудованим zip (tools/win_launcher)
      - uses: actions/setup-go@v5
        if: matrix.target == 'windows'
        with:
          go-version: '1.22'
          cache: false

      - name: Portable Windows exe
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # іконка — з нашого assets/icon.png (раніше бралась перша знайдена app_icon.ico,
          # і нею виявилась стандартна іконка Flet)
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').convert('RGBA').save('tools/win_launcher/app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          Push-Location tools/win_launcher
          go run github.com/akavel/rsrc@v0.10.2 -ico app.ico -o rsrc.syso
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$env:APP_VERSION" -o ../../UAFix-Player-Windows.exe .
          Pop-Location
          Get-Item UAFix-Player-Windows.exe | Select-Object Name, Length

      - name: Pack Android apk
        if: matrix.target == 'apk'
        run: |
          ls -la build/apk
          if [ "${{ matrix.tv }}" = "true" ]; then
            cp "$(ls build/apk/*armeabi*.apk | head -1)" "${{ matrix.artifact }}-armv7.apk"
          else
            cp "$(ls build/apk/*arm64*.apk | head -1)" "${{ matrix.artifact }}-arm64.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            UAFix-Player-*.zip
            UAFix-Player-*.apk
            UAFix-Player-*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # опис змін — розділ «## <версія>» із CHANGELOG.md; його ж показує застосунок
      # у вікні оновлення й «Що нового»
      - name: Release notes
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("release_notes.md", "w", encoding="utf-8").write(
              m.group(1).strip() if m else "Виправлення та покращення.")

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: UAFix Player ${{ github.ref_name }}
          body_path: release_notes.md
          make_latest: true
          files: dist/*
